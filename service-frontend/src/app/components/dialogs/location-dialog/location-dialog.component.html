<div class="location-dialog-modal">
  <!-- Modal Luxury Header -->
  <div class="dialog-header-luxury">
    <div class="header-leading">
      <div class="icon-badge">
        <mat-icon>place</mat-icon>
      </div>
      <div class="header-titles">
        <h2>Localisation & Coordonnées GPS</h2>
        <p>Position géographique du chantier et itinéraire d'intervention</p>
      </div>
    </div>
    <button mat-icon-button mat-dialog-close class="close-btn" matTooltip="Fermer">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-body-luxury">
    <!-- Top Mission Strip -->
    <div class="mission-loc-strip">
      <div class="loc-meta-item">
        <span class="meta-label">Mission :</span>
        <span class="meta-value">{{ data.reservation.title | cleanText }}</span>
      </div>
      <div class="loc-meta-item">
        <span class="meta-label">Client :</span>
        <span class="meta-value">{{ data.reservation.clientName || 'Client' }}</span>
      </div>
      <div class="loc-meta-item" *ngIf="data.reservation.address">
        <span class="meta-label">Adresse :</span>
        <span class="meta-value">{{ data.reservation.address }}</span>
      </div>
    </div>

    <!-- GPS Display & Actions -->
    <div class="gps-coords-bar" *ngIf="data.reservation.latitude && data.reservation.longitude">
      <div class="gps-tag">
        <mat-icon>gps_fixed</mat-icon>
        <span>Coordonnées : <strong>{{ formatCoordinates() }}</strong></span>
      </div>
      <div class="gps-actions">
        <button mat-stroked-button (click)="copyCoordinates()" class="btn-copy">
          <mat-icon>content_copy</mat-icon>
          <span>Copier</span>
        </button>
        <button mat-stroked-button (click)="openInMaps()" class="btn-maps">
          <mat-icon>open_in_new</mat-icon>
          <span>Ouvrir dans Maps</span>
        </button>
      </div>
    </div>

    <!-- Map container -->
    <div class="map-card-wrapper">
      <app-location-map
        [position]="getPosition()"
        [title]="'Localisation du chantier'"
        [height]="'360px'"
        [readonly]="true"
        [showHeader]="false"
        [showActions]="true"
        [showInfo]="false">
      </app-location-map>
    </div>
  </div>

  <div class="dialog-actions-luxury">
    <button mat-flat-button color="primary" mat-dialog-close class="btn-close-map">
      Fermer
    </button>
  </div>
</div>
