<div class="dialog-modern-container">
  <div class="dialog-modern-header">
    <div class="dialog-header-badge">
      <mat-icon>payments</mat-icon>
    </div>
    <div class="dialog-header-text">
      <h2>Ajouter un tarif</h2>
      <p>Configurez le montant HT et la période de validité de cette tâche</p>
    </div>
  </div>

  <div class="dialog-modern-body">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Prix HT (€)</mat-label>
      <mat-icon matPrefix>attach_money</mat-icon>
      <input matInput type="number" [(ngModel)]="data.price" placeholder="Ex: 45.00" min="0" step="0.5" required />
      <span matSuffix class="field-currency">EUR</span>
    </mat-form-field>

    <div class="dates-grid">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Date de début</mat-label>
        <input matInput [matDatepicker]="pickerStart" [(ngModel)]="data.startDate" placeholder="JJ/MM/AAAA" />
        <mat-datepicker-toggle matSuffix [for]="pickerStart"></mat-datepicker-toggle>
        <mat-datepicker #pickerStart></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Date de fin (optionnelle)</mat-label>
        <input matInput [matDatepicker]="pickerEnd" [(ngModel)]="data.endDate" placeholder="JJ/MM/AAAA" />
        <mat-datepicker-toggle matSuffix [for]="pickerEnd"></mat-datepicker-toggle>
        <mat-datepicker #pickerEnd></mat-datepicker>
      </mat-form-field>
    </div>
  </div>

  <div class="dialog-modern-actions">
    <button mat-button mat-dialog-close class="btn-cancel">
      Annuler
    </button>
    <button mat-raised-button color="primary" [mat-dialog-close]="data" [disabled]="data.price == null || data.price < 0" class="btn-primary">
      <mat-icon>check</mat-icon>
      Valider le tarif
    </button>
  </div>
</div>
