<div class="dialog-modern-container">
  <div class="dialog-modern-header">
    <div class="dialog-header-badge">
      <mat-icon>category</mat-icon>
    </div>
    <div class="dialog-header-text">
      <h2>Nouvelle catégorie</h2>
      <p>Créez une catégorie principale de services (ex: Plomberie, Peinture)</p>
    </div>
  </div>

  <div class="dialog-modern-body">
    <form #categoryForm="ngForm" class="category-form">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Nom de la catégorie</mat-label>
        <mat-icon matPrefix>label</mat-icon>
        <input matInput [(ngModel)]="data.name" name="name" placeholder="Ex: Menuiserie & Serrurerie" required autofocus>
        <mat-error *ngIf="!data.name">Le nom est obligatoire</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Description</mat-label>
        <mat-icon matPrefix>description</mat-icon>
        <textarea matInput [(ngModel)]="data.description" name="description" rows="3" placeholder="Décrivez les types de prestations couvertes..." required></textarea>
        <mat-error *ngIf="!data.description">La description est obligatoire</mat-error>
      </mat-form-field>

      <div class="upload-box-modern" (click)="fileInput.click()">
        <input hidden (change)="onFileSelected($event)" #fileInput type="file" accept="image/*">
        
        <div *ngIf="!imagePreview" class="upload-state-empty">
          <mat-icon class="upload-icon">cloud_upload</mat-icon>
          <span class="upload-text">Importer une icône ou illustration</span>
          <span class="upload-subtext">JPG, PNG (max 5 Mo)</span>
        </div>

        <div *ngIf="imagePreview" class="upload-state-preview">
          <img [src]="imagePreview" alt="Aperçu catégorie">
          <div class="preview-actions">
            <span class="file-name">{{ data.file?.name }}</span>
            <button type="button" class="btn-change" (click)="$event.stopPropagation(); fileInput.click()">
              <mat-icon>photo_camera</mat-icon>
              Modifier
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>

  <div class="dialog-modern-actions">
    <button mat-button (click)="onCancel()" class="btn-cancel">Annuler</button>
    <button mat-raised-button color="primary" [mat-dialog-close]="data" [disabled]="!categoryForm.form.valid || !data.file" class="btn-primary">
      <mat-icon>add</mat-icon>
      Créer la catégorie
    </button>
  </div>
</div>
