<header class="app-header">
  <div class="header-inner">
    <!-- Brand Logo -->
    <a class="nav-brand" routerLink="/home" (click)="closeMobileMenu()">
      <img src="/img/logo.png" alt="AledhemTek" class="brand-logo-img" onerror="this.style.display='none'" />
      <span class="brand-name">Aledhem<span class="brand-highlight">Tek</span></span>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="desktop-nav">
      <a class="nav-item" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <mat-icon class="nav-icon">home</mat-icon>
        <span>Accueil</span>
      </a>

      <!-- Guest Links -->
      <ng-container *ngIf="!isLoggedIn">
        <a class="nav-item" routerLink="/login" routerLinkActive="active">
          <span>Connexion</span>
        </a>
        <a class="btn-register" routerLink="/register">
          <span>S'inscrire</span>
        </a>
      </ng-container>

      <!-- Authenticated User Menu -->
      <ng-container *ngIf="isLoggedIn">
        <a class="nav-item" [routerLink]="getDashboardLink()" routerLinkActive="active">
          <mat-icon class="nav-icon">dashboard</mat-icon>
          <span>Espace {{ userRole | titlecase }}</span>
        </a>

        <!-- User Dropdown Menu -->
        <button mat-button [matMenuTriggerFor]="userMenu" class="user-profile-btn">
          <div class="user-avatar-pill">
            <mat-icon class="avatar-icon">account_circle</mat-icon>
            <span class="user-role-badge" [ngClass]="'role-' + userRole">{{ userRole }}</span>
            <mat-icon class="dropdown-chevron">keyboard_arrow_down</mat-icon>
          </div>
        </button>

        <mat-menu #userMenu="matMenu" xPosition="before" class="modern-user-menu">
          <div class="menu-header">
            <span class="menu-user-role">Rôle : <strong>{{ userRole | uppercase }}</strong></span>
          </div>
          <mat-divider></mat-divider>
          <a mat-menu-item [routerLink]="getDashboardLink()">
            <mat-icon>speed</mat-icon>
            <span>Tableau de bord</span>
          </a>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()" class="menu-logout-item">
            <mat-icon color="warn">logout</mat-icon>
            <span>Déconnexion</span>
          </button>
        </mat-menu>
      </ng-container>
    </nav>

    <!-- Mobile Hamburger Button -->
    <button class="mobile-toggle-btn" (click)="toggleMobileMenu()" aria-label="Menu principal">
      <mat-icon>{{ isMobileMenuOpen ? 'close' : 'menu' }}</mat-icon>
    </button>
  </div>

  <!-- Mobile Dropdown Drawer -->
  <div class="mobile-drawer" [class.open]="isMobileMenuOpen">
    <nav class="mobile-nav">
      <a class="mobile-nav-item" routerLink="/home" (click)="closeMobileMenu()" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <mat-icon>home</mat-icon>
        <span>Accueil</span>
      </a>

      <ng-container *ngIf="!isLoggedIn">
        <a class="mobile-nav-item" routerLink="/login" (click)="closeMobileMenu()" routerLinkActive="active">
          <mat-icon>login</mat-icon>
          <span>Connexion</span>
        </a>
        <a class="mobile-nav-item mobile-highlight" routerLink="/register" (click)="closeMobileMenu()" routerLinkActive="active">
          <mat-icon>person_add</mat-icon>
          <span>Créer un compte</span>
        </a>
      </ng-container>

      <ng-container *ngIf="isLoggedIn">
        <a class="mobile-nav-item" [routerLink]="getDashboardLink()" (click)="closeMobileMenu()" routerLinkActive="active">
          <mat-icon>dashboard</mat-icon>
          <span>Tableau de bord ({{ userRole }})</span>
        </a>
        <button class="mobile-nav-item mobile-logout" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Se déconnecter</span>
        </button>
      </ng-container>
    </nav>
  </div>
</header>
