# ==========================================================
# LOCAL DEVELOPMENT PROFILE (Zero External Dependency / H2 In-Memory)
# Use: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# ==========================================================
spring.application.name=aledhemtek-dev
server.port=8080

# In-memory H2 with MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:aledhemtek;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Enable H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Upload Configuration
storage.root-dir=uploads
storage.service-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Secret
